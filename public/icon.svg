  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Protective Shield -->
  <path d="M256 80 L380 130 C380 260 330 360 256 420 C182 360 132 260 132 130 Z" fill="none" stroke="url(#shield)" stroke-width="20" stroke-linejoin="round" />
