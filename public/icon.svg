  <path d="M190 200 C170 170 160 150 140 140 C170 150 200 175 220 200" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" />
  <path d="M322 200 C342 170 352 150 372 140 C342 150 312 175 292 200" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" />
  <!-- Pulse Line (Livestock Health Monitoring) -->
  <path d="M170 270 L210 270 L230 220 L256 320 L280 240 L300 270 L342 270" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Veterinary Cross in Amber -->
  <rect x="246" y="150" width="20" height="50" rx="6" fill="url(#gold)" />
  <rect x="231" y="165" width="50" height="20" rx="6" fill="url(#gold)" />
</svg>
